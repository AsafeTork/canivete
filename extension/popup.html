<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><style>
@font-face{font-family:'Space Grotesk';src:url('fonts/SpaceGrotesk-latin.woff2') format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'Geist Mono';src:url('fonts/GeistMono-latin.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--fundo:#0b0b0b;--card:#141414;--hair:#262626;--luz:#faf9f5;--neutro:#9a9a95;--acento:#c2ff3d;--ok:#8fd4a8;--erro:#ff6b5e;--raio:6px}
body{width:264px;background:var(--fundo);color:var(--luz);margin:0;padding:12px;
  font:450 13px/20px 'Space Grotesk',system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
header svg{width:18px;height:18px;color:var(--luz);flex:none}
.word{font-weight:650;font-size:15px;letter-spacing:-0.3px;flex:1}
#dot{width:8px;height:8px;border-radius:999px;background:var(--neutro);flex:none}
#dot.on{background:var(--ok)} #dot.off{background:var(--erro)}
#status{color:var(--neutro);font-size:13px;margin:0 0 12px}
button{font:inherit;color:var(--luz);background:transparent;border:1px solid var(--hair);
  border-radius:var(--raio);padding:6px 10px;cursor:pointer}
button:hover{background:#1a1a1a}
button:active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
#mark{width:100%;background:var(--acento);color:#0b0b0b;font-weight:650;border:0;padding:8px 10px;margin-bottom:8px}
#mark:hover{filter:brightness(.92)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
details{border-top:1px solid var(--hair);padding-top:8px}
summary{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--neutro);
  font:inherit;background:transparent;border:1px solid var(--hair);border-radius:var(--raio);
  padding:6px 10px;cursor:pointer;list-style:none;margin-bottom:8px}
summary::marker{content:''}
summary::after{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translateY(-1px);transition:transform 120ms ease-out;flex:none}
details[open] summary::after{transform:rotate(225deg) translateY(-1px)}
summary:hover{background:#1a1a1a;color:var(--luz)}
details[open] summary{color:var(--luz)}
label{display:block;color:var(--neutro);font-size:13px;margin-bottom:4px}
input{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--hair);
  border-radius:var(--raio);color:var(--luz);font:inherit;padding:6px 8px;margin-bottom:8px}
input::placeholder{color:var(--neutro)}
.duo button:last-child{margin-bottom:0}
.mono{font-family:'Geist Mono',monospace;font-size:11px;line-height:16px;color:var(--neutro);margin:8px 0 0;word-break:break-all}
</style></head>
<body>
<header>
  <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
    <path d="M23.6 8.9 A9.8 9.8 0 1 0 22.8 23.9" stroke="currentColor" stroke-width="4.8" stroke-linecap="round"/>
    <path d="M22.6 23.4 C24.6 18.2, 27.2 11.9, 30.6 5.8 L27.8 18.9 C26.4 20.3, 24.6 21.9, 23.3 23.6 Z" fill="#C2FF3D"/>
    <circle cx="22.9" cy="23.4" r="1.3" fill="#0b0b0b"/>
  </svg>
  <span class="word">canivete</span><span id="dot"></span>
</header>
<p id="status">carregando…</p>
<button id="mark">Marcar o que está quebrado</button>
<div class="duo"><button id="toggle">Pausar</button><button id="test">Testar conexão</button></div>
<button id="painel" style="width:100%;margin-bottom:8px">Painel</button>
<details>
  <summary>conectar…</summary>
  <label for="token">Token — o arquivo token.txt desta extensão</label>
  <input id="token" type="password" placeholder="cole o token.txt">
  <button id="save" style="width:100%;margin-bottom:8px">Salvar token</button>
  <label for="label">Nome deste perfil</label>
  <input id="label" maxlength="60" placeholder="pessoal, trabalho…">
  <button id="saveLabel" style="width:100%">Salvar nome</button>
</details>
<p class="mono" id="client">cliente: …</p>
<p class="mono" id="diag"></p>
<script src="popup.js"></script>
</body></html>
